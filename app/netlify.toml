# Netlify: static app from dist/, AI routes from netlify/functions/api.mts.
# Set ANTHROPIC_API_KEY in Site configuration → Environment variables
# (Functions scope). Never put the key in this file.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
